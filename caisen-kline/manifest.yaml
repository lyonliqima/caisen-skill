summary: >-
  【免费 · 仅供学习交流】给一个标的代码，自动取真实 K 线 → 蔡森 A 招颈线识别 + B 招等幅满足
  + K 招失败识别 → 出高清中文标注 K 线图 + 五块结构化文字分析，强制带 C1–C4 风险约束与
  非投资建议声明。用于理解颈线/等幅满足/假突破等技术分析方法，不构成投资建议。

# ===== 上架须知：以下为硬前置，不满足则技能完全无法运行 =====
requirements:
  connectors:
    - id: tdx-connector
      name: 通达信
      required: true
      note: >-
        硬前置、无替代。未连接则取不到 K 线，技能完全不可用。
        开启：WorkBuddy → 连接器管理 → 通达信 tdx-connector → 启用并信任 → 显示「已连接」。
  python:
    - pandas>=1.3
    - matplotlib>=3.4
    - mplfinance>=0.12
  fonts:
    note: >-
      无需手动配置。绘图时运行时自动探测系统 CJK 字体，候选覆盖 macOS（Hiragino Sans GB /
      STHeiti / PingFang SC / Songti SC）、Windows（微软雅黑 / 黑体）、Linux（文泉驿 /
      Noto Sans CJK / 思源黑体），全无时扫描字体表兜底。

supported_markets:
  ok:
    - A股（沪市 / 深市 / 创业板）
    - 港股
    - 期货（上期所/大商所/郑商所/广期所）
    - 指数（中证系列）
    - ETF / 跨境ETF
  unsupported:
    - 美股（lookup 可查到，kline 返回空）
    - 外汇 / 汇率
    - 中金所 / 上期能源
    - 北交所（2026-09-11 实测：lookup 可查到，kline 返回空 Rows）
    - 债券 / 可转债（2026-09-11 实测：kline 返回空 Rows）

disclaimer: >-
  本技能输出的所有形态判定、目标价位与文字分析均为「几何与量价观察」，非投资建议，不构成任何买卖依据。
  原书案例无回测、无胜率统计。使用者须自行交叉校验基本面并自负盈亏。
