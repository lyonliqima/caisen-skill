# 资本三流观测 —— 指标与权重配置
# 所有阈值、权重均可在此集中调整，无需改代码。

# ── 数据采集开关 ─────────────────────────────────────────────
# 每个数据源独立开关；采集失败自动降级（返回 None），不影响其它指标。
# akshare 函数名均已对照当前 master 源码核实（见 references/data_sources.md）。
# 标注（已移除）的项为 2024-08 后交易所停更 / akshare 已下线的接口，仅作记录。
sources:
  m2:                # 广义货币 M2（月）— 央行
    enabled: true
    akshare_fn: macro_china_money_supply
    cache_days: 365
  gdp_nominal:       # 名义 GDP（季）— 统计局（用于流速 V=GDP/M2）
    enabled: true
    akshare_fn: macro_china_gdp
    cache_days: 730
  forex_reserve:     # 外汇储备（月）— 外管局，取"国家外汇储备"
    enabled: true
    akshare_fn: macro_china_foreign_exchange_gold
    cache_days: 365
  base_money:        # 基础货币（月）— 央行，取"储备货币"算货币乘数
    enabled: true
    akshare_fn: macro_china_central_bank_balance
    cache_days: 365
  margin:            # 融资融券余额（日）— 上交所/深交所
    enabled: true
    akshare_fn: macro_china_market_margin_sh
    cache_days: 30
  main_force:        # 大盘主力资金净流入（日）— 东财，取"主力净流入-净额"
    enabled: true
    akshare_fn: stock_market_fund_flow
    cache_days: 30
  fx_rate:           # 人民币汇率 USD/CNY（实时）— 东财外汇，取 USDCNY 最新价/涨跌幅
    enabled: true
    akshare_fn: forex_spot_em
    cache_days: 1
  sector_flow:       # 板块（行业）资金流（即时）— 同花顺，取各行业主力净流入算 HHI
    enabled: true
    akshare_fn: stock_fund_flow_industry
    cache_days: 1
  # ── 已移除 / 不可用（仅记录，不采集）──
  north_flow:        # （已移除）北向净流量 2024-08-19 起停更，akshare 已下掉接口
    enabled: false
    akshare_fn: null
  social_financing:  # （已移除）akshare master 无对应函数
    enabled: false
    akshare_fn: null
  usd_index:         # （已移除）master 无 macro_usa_dollar_index
    enabled: false
    akshare_fn: null

# ── 流向综合指数 CFCI 权重 ──────────────────────────────────
# 各分项净流入对 CFCI(-100~+100) 的贡献权重，须求和≈1
# 注：北向净流量自2024-08停更、akshare已移除，故 CFCI 现由
#     主力资金(main_flow) + 融资变化(margin_flow) + 外汇变动(fx_flow) 三项构成；
# 某分项缺失时由 calculator 自动按可用项重新归一化。
cfci_weights:
  main_flow:   0.40   # 大盘主力资金净流入（市场内资本流向）
  margin_flow: 0.30   # 融资融券余额变化（杠杆资金流向）
  fx_flow:     0.30   # 外汇储备变动（跨境资本流向代理）

# ── 流转效率指数 CFEI 权重 ──────────────────────────────────
cfei_weights:
  money_multiplier: 0.30   # 货币乘数 = M2 / 基础货币
  velocity:        0.40   # 货币流通速度 = GDP / M2
  credit_turnover: 0.30   # 信贷周转率 = 社融增量 / M2

# ── 走资风险指数 CRI 权重 ───────────────────────────────────
# 两项求和应 = 1；某分项缺失时 calculator 自动重新归一化（见 cri_usdcny_available）。
cri_weights:
  forex_change: 0.65  # 外汇储备变动（主）：外储降 → 风险升
  usdcny:       0.35  # 人民币贬值压力（外部代理）：USD/CNY 涨 → 风险升

# ── 三流共振打分阈值 ───────────────────────────────────────
# 单维度打分: 扩张/净流入/加快 = +1, 持平 = 0, 收缩/净流出/放缓 = -1
scoring:
  volume:
    # M2 同比变动（%）判定流量扩张/收缩
    m2_yoy_up: 10.0      # ≥ 此值 → +1
    m2_yoy_down: 7.0     # ≤ 此值 → -1; 之间 → 0
    # 大盘主力资金净流入（亿元）判定市场内流量方向
    main_flow_up: 300     # ≥ → +1
    main_flow_down: -300  # ≤ → -1
  velocity:
    # 货币流通速度 V = GDP/M2（宏观流速）
    v_up: 0.45        # ≥ → +1（流速正常/加快）
    v_down: 0.40      # ≤ → -1（流速偏低/空转）
  direction:
    # 目标领域（A股+实体）净流向方向系数 D
    d_up: 0.1            # D ≥ → +1（净流入）
    d_down: -0.1         # D ≤ → -1（净流出）
    # 人民币贬值压力阈值（USD/CNY 当日涨跌幅 %）：
    #   ≥ +usdcny_weak → 资本外流压力（方向 -1）
    #   ≤ -usdcny_weak → 人民币升值支撑（方向 +1）
    usdcny_weak: 0.2

# ── M2 增速基准带（判定"流量大不大"）──────────────────────
# 近5年 M2 同比常态约 7%~12%：<low 偏收缩，>high 偏扩张，之间中性收敛
m2_bands:
  low: 8.0
  high: 11.0

# ── 综合判定 ───────────────────────────────────────────────
verdict:
  resonance_min: 2     # S ≥ 2 → 三流同向共振，趋势确立
  chaos_max: 0         # S ≤ 0 → 三流背离紊乱，混沌期

# ── 板块资金流交易参考排名 ─────────────────────────────────
sector_ranking:
  top_n: 5        # 净流入前 N 行业（多头方向）
  bottom_n: 5     # 净流出前 N 行业（空头/回避方向）

# ── 板块流向集中度 HHI 解读阈值 ────────────────────────────
# HHI = Σ (|行业主力净流入_i| / Σ|净流入|)²，取值 [1/N, 1]
#   N 为行业数；HHI 越高 = 资金越集中少数板块（趋势强但结构脆）
hhi:
  concentrated: 0.18   # ≥ 此值 → 资金高度集中（少数板块吸金）
  balanced:    0.08    # ≤ 此值 → 资金分散（普涨/结构健康）
  # 介于 balanced~concentrated 之间 → 中度集中

# ── 输出 ───────────────────────────────────────────────────
output:
  reports_dir: reports
  cache_dir: data/cache
  # 报告保留天数
  keep_reports_days: 90

# ════════════════════════════════════════════════════════════════
# 向心坍缩全球风险早期预警指标体系（卢麒元 M3 扩展）
# 来源：lu-qiyuan-analysis/references/collapse-risk-indicators.md
# 五级传导链：日元套息 → 美元流动性 → 地缘能源 → 非美压力 → 风险情绪
# 三级阈值：观察预警(watch) / 风险升温(warm) / 坍缩临界点(critical)
# 方向 direction: up 表示"数值越高越危险"（本框架全部为 up）。
# 分类逻辑（calculator.compute_collapse_risk）：
#   v >= critical            → critical（坍缩临界点）
#   warm_low <= v (<crit)    → warm（风险升温）
#   watch_low <= v (<warm_low)→ watch（观察预警）
#   v < watch_low            → normal（平稳）
# 定性指标(kind: qualitative) 无数值阈值，由 data/qualitative_state.json 人工/订阅源置位，
# 其中 hormuz / mideast_export_cut / us_iran_conflict 为"坍缩重大催化项"，任一为真直接上调风险等级。
# ════════════════════════════════════════════════════════════════
global_collapse_risk:
  indicators:
    # ── ① 日元套息交易先导组（最高优先级）──
    usdjpy:
      name: "美元兑日元 USD/JPY"
      group: "①日元套息先导组"
      direction: up
      watch_low: 152
      warm_low: 156
      warm_high: 160
      critical: 160
      unit: "JPY/USD"
      akshare_fn: "forex_spot_em(USDJPY)"
      note: "突破160=日银容忍贬值上限打破，套息盘抢跑平仓火源"
    us_jp_spread:
      name: "美日10年期利差 US10Y−JP10Y"
      group: "①日元套息先导组"
      direction: up
      watch_low: 320
      warm_low: 350
      warm_high: 380
      critical: 380
      unit: "bp"
      akshare_fn: "bond_zh_us_rate(美10Y) − macro_japan_yield_curve(日10Y)"
      note: "利差扩张喂养套息；快速收窄(美债下/日债上)→杠杆平仓"
    jgb10y:
      name: "日本10年期国债收益率 JGB10Y"
      group: "①日元套息先导组"
      direction: up
      watch_low: 0.9
      warm_low: 1.0
      warm_high: 1.1
      critical: 1.15
      unit: "%"
      akshare_fn: "macro_japan_yield_curve(10Y)"
      note: "日债收益率上行=变相融资成本抬升；>1.15触发政策被迫转向预期"
    cftc_jpy:
      name: "日元套息CFTC非商业净持仓"
      group: "①日元套息先导组"
      kind: qualitative
      signal: "投机空头规模创阶段新高后连续两周快速回落"
      note: "空头了结=大规模平仓启动前兆（需人工/订阅源判断）"

    # ── ② 全球美元流动性核心组（资本三流·流量/流速）──
    fra_ois:
      name: "离岸美元流动性 FRA-OIS利差"
      group: "②美元流动性核心组"
      direction: up
      watch_low: 18
      warm_low: 30
      warm_high: 50
      critical: 60
      unit: "bp"
      akshare_fn: "（需专业源，暂手动）"
      note: "上行=离岸美元荒，非美资产流动性被抽干"
    us10y:
      name: "美国10年期美债收益率 US10Y"
      group: "②美元流动性核心组"
      direction: up
      watch_low: 4.35
      warm_low: 4.50
      warm_high: 4.70
      critical: 4.80
      unit: "%"
      akshare_fn: "bond_zh_us_rate(美国国债收益率10年)"
      note: "长端上行抬升全球风险资产分母，强化美元向心"
    fed_balance:
      name: "美联储资产负债表/SRF使用"
      group: "②美元流动性核心组"
      kind: qualitative
      signal: "持续缩表 + SRF使用规模持续走高"
      note: "SRF走高=银行间美元流动性紧张（环境信号，无单点阈值）"
    dxy:
      name: "美元指数 DXY"
      group: "②美元流动性核心组"
      direction: up
      watch_low: 106.5
      warm_low: 108
      warm_high: 110
      critical: 110
      unit: "pt"
      akshare_fn: "macro_usa_dollar_index（master已移除，待验证）"
      note: "强美元自我强化，非美被动承压、消耗外储"

    # ── ③ 能源与地缘变量（资本三流·流向）──
    brent:
      name: "布伦特原油 Brent"
      group: "③能源与地缘组"
      direction: up
      watch_low: 88
      warm_low: 95
      warm_high: 105
      critical: 110
      unit: "美元/桶"
      akshare_fn: "macro_oil_brent（待验证）"
      note: "高位持续=能源进口国消耗美元储备、放大输入通胀"
    hormuz:
      name: "霍尔木兹海峡航运受袭/通行受限"
      group: "③能源与地缘组"
      kind: qualitative
      signal: "航运遭袭或通行受限"
      note: "坍缩重大催化项（任意一条直接上调风险等级）"
    mideast_export_cut:
      name: "中东主要产油国主动削减出口"
      group: "③能源与地缘组"
      kind: qualitative
      signal: "主要产油国主动削减出口"
      note: "坍缩重大催化项"
    us_iran_conflict:
      name: "美伊直接军事冲突升级"
      group: "③能源与地缘组"
      kind: qualitative
      signal: "美伊直接军事冲突升级"
      note: "坍缩重大催化项"

    # ── ④ 非美经济体脆弱性指标 ──
    usdkrw:
      name: "美元兑韩元 USD/KRW"
      group: "④非美经济体脆弱性组"
      direction: up
      watch_low: 1420
      warm_low: 1440
      warm_high: 1460
      critical: 1460
      unit: "KRW/USD"
      akshare_fn: "forex_spot_em(USDKRW)"
      note: "汇率失控=东亚货币贬值竞赛扩散（风险升温区间用户未给精确值，取1420~1460插值）"
    em_fx_reserve:
      name: "新兴市场外汇储备增速"
      group: "④非美经济体脆弱性组"
      kind: qualitative
      signal: "工业国/新兴市场外储连续3月环比下滑；多国抛售美债稳汇率"
      note: "抛售美债→美债收益率上行→加剧向心坍缩（自救即加剧）"
    em_cds:
      name: "新兴市场主权CDS"
      group: "④非美经济体脆弱性组"
      kind: qualitative
      signal: "CDS持续走高，主权违约预期升温"
      note: "主权风险→外资撤离→资产踩踏"

    # ── ⑤ 风险情绪与资产踩踏确认指标 ──
    vix:
      name: "VIX美股恐慌指数"
      group: "⑤风险情绪确认组"
      direction: up
      watch_low: 22
      warm_low: 25
      warm_high: 30
      critical: 32
      unit: "pt"
      akshare_fn: "stock_us_spot_em(VIX)（待验证）"
      note: "踩踏确认：股跌+美债抛售+黄金弱+商品跌+非美杀跌=抢美元现金"

  # 定性/屏障观测（区分外部冲击 vs 本土系统性风险，不触发崩盘阈值）
  transmission_observations:
    northbound_4w_outflow: "北向资金连续4周大额净流出"
    cny_weak_but_pboc: "人民币快速走弱但央行启动调控、外储稳定"
    domestic_credit_tightening: "国内信用环境独立收紧（重点观察）"

  # 简易判定规则（实操）
  verdict_rule:
    mild_pressure: "1~2 个指标进入观察预警区间，其余平稳 → 温和压力（常态）"
    risk_warming: "≥3 个指标进入风险升温区间，且最好包含[日元/原油/美债]其中两项 → 风险升温"
    collapse_accel_any_of:
      - "≥4 项指标触及坍缩临界点"
      - "出现中东航道阻断 / 日本央行超预期加息等突发催化"
